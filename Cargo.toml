# Workspace Cargo raiz do Firebird Studio Linux.
# O crate do backend desktop (Tauri) ficará em apps/desktop/src-tauri e será
# adicionado aos members na Fase 0/1.
[workspace]
resolver = "2"
members = []

# Perfil do workspace: otimizações de release para o binário desktop.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
